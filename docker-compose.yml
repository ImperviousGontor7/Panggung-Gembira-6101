services:

  postgres:

    image: postgres:18

    container_name: impervious-postgres


    restart: always


    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: password

      POSTGRES_DB: impervious



    ports:

      - "5432:5432"



    volumes:

      - postgres_data:/var/lib/postgresql/data



  redis:

    image: redis:8

    container_name: impervious-redis


    restart: always


    ports:

      - "6379:6379"



volumes:

  postgres_data: