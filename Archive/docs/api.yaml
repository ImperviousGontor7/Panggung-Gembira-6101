openapi: 3.0.0


info:

  title: Impervious API

  version: 1.0.0



servers:

  - url: http://localhost:5001/api



paths:


  /health:


    get:


      summary: Server Health


      responses:


        200:


          description: OK





  /auth/login:


    post:


      summary: Login User


      requestBody:


        required: true


        content:


          application/json:


            schema:


              type: object


              properties:


                email:

                  type: string



                password:

                  type: string



      responses:


        200:


          description: Login Success